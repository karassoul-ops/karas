name: ios_sideload tests

on:
  push:
    paths:
      - "ios_sideload/**"
      - ".github/workflows/ios_sideload_tests.yml"
  pull_request:
    paths:
      - "ios_sideload/**"
      - ".github/workflows/ios_sideload_tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r ios_sideload/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: ios_sideload
